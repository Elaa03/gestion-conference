<section class="panel notifications-panel" id="notifications">

  <div class="panel-icon notification-icon">
    🔔
  </div>

  <div class="panel-content">

    <h2>Zone de notifications</h2>

    <p>
      Vous avez
      <strong>{{ notifList.length }}</strong>
      nouvelles notifications.
    </p>

    <button
      class="secondary-button"
      type="button"
      (click)="showNotifications()">

      {{ btnText }}

    </button>

    @if (show) {

      <ul class="notification-list">

        @for (item of notifList; track item.id) {

          <li>{{ item.message }}</li>

        }

      </ul>

    }

  </div>

</section>
