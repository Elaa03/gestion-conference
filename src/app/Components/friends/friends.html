<section class="panel friends-panel" id="amis">

  <div class="panel-icon friends-icon">
    👥
  </div>

  <div class="panel-content friends-content">

    <h2>Liste des amis</h2>

    <div class="friend-inputs">

      @for (item of friendsList; track item.email) {

        <input
          type="text"
          [(ngModel)]="item.name"
        />

      }

    </div>

    <ul>

      @for (item of friendsList; track item.email) {

        <li>{{ item.name }}</li>

      }

    </ul>

  </div>

</section>
